name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [closed]

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && ((github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository))) || (github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    concurrency:
      group: alchemy-deploy-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || github.event.workflow_run.event == 'pull_request' && format('pr-{0}', github.event.workflow_run.pull_requests[0].number) || github.event.workflow_run.event == 'push' && 'prod' || 'invalid' }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Load production credentials from 1Password
        id: op_production
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.34.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/oy3puotuvwkllmdyid7zki2sia
          CLOUDFLARE_ACCOUNT_ID: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/yq5irxnmhobzqfx2knbytjtrc4
          DISCORD_BOT_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/kfirzfgrm6bcyxzlxxxyrihgc4
          DISCORD_GUILD_ID: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/ksw5s6oa5cdjd2zgj4hv6pnzjq
          DISCORD_TARGET_CHANNEL_ID: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/dkqmjo3c3zgfxbl2k2cqbu2lbq
          EMAIL_TO: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/yzl63k2lbake4onxejnbgwv3re
          RESEND_API_KEY: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/lungp4ntjdaadw3cdfjrvpezma
          EMAIL_FROM_NAME: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/rlylwe6lukzgenapthsykqsr2a
          EMAIL_FROM_EMAIL: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/ov4be76yq67mlf4zrxnwabwiom
          ADMIN_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/ld66t7iajpicndynxvswcffgye

      - name: Load preview credentials from 1Password
        id: op_preview
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.34.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/oy3puotuvwkllmdyid7zki2sia
          CLOUDFLARE_ACCOUNT_ID: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/yq5irxnmhobzqfx2knbytjtrc4

      - name: Load preview cleanup credentials from 1Password
        id: op_cleanup
        if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.34.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/oy3puotuvwkllmdyid7zki2sia
          CLOUDFLARE_ACCOUNT_ID: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/yq5irxnmhobzqfx2knbytjtrc4

      - name: Run Alchemy deployment
        uses: mynameistito/alchemy-deploy@4e29a36d61cf8cc4277bdcd35d7b3eff13150b38 # v3.2.0
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.op_production.outputs.CLOUDFLARE_ACCOUNT_ID || steps.op_preview.outputs.CLOUDFLARE_ACCOUNT_ID || steps.op_cleanup.outputs.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ steps.op_production.outputs.CLOUDFLARE_API_TOKEN || steps.op_preview.outputs.CLOUDFLARE_API_TOKEN || steps.op_cleanup.outputs.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ steps.op_production.outputs.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ steps.op_production.outputs.DISCORD_GUILD_ID }}
          DISCORD_TARGET_CHANNEL_ID: ${{ steps.op_production.outputs.DISCORD_TARGET_CHANNEL_ID }}
          EMAIL_TO: ${{ steps.op_production.outputs.EMAIL_TO }}
          RESEND_API_KEY: ${{ steps.op_production.outputs.RESEND_API_KEY }}
          EMAIL_FROM_NAME: ${{ steps.op_production.outputs.EMAIL_FROM_NAME }}
          EMAIL_FROM_EMAIL: ${{ steps.op_production.outputs.EMAIL_FROM_EMAIL }}
          ADMIN_TOKEN: ${{ steps.op_production.outputs.ADMIN_TOKEN }}
        with:
          worker-name: discord-announcement-email-bridge-prod
          deploy-command: ALCHEMY_STAGE="$STAGE" BUILD_VERSION="$DEPLOYMENT_SHA" bunx --no-install alchemy deploy --stage "$STAGE" --yes
          destroy-command: ALCHEMY_STAGE="$STAGE" bunx --no-install alchemy destroy --stage "$STAGE" --yes
          production-stage: prod
          production-branch: main
          production-url: https://discord-announcement-email-bridge-prod.mynameistito.workers.dev
          preview-url-pattern: https://{stage}-{worker}.*.workers.dev
          preview-artifact: worker-bundle
          preview-entrypoint: worker.js
          preview-compatibility-date: "2026-09-25"
          preview-compatibility-flags: '["nodejs_compat"]'
          worker-config: >-
            {"BUILD_VERSION":"${{ github.event.workflow_run.head_sha || github.sha }}","STAGE":"${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || github.event.workflow_run.event == 'pull_request' && format('pr-{0}', github.event.workflow_run.pull_requests[0].number) || 'preview' }}"}
