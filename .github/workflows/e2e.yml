name: Discord E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        id: op_e2e
        with:
          version: 2.34.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TARGET_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_PREVIEW_API_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/ynusvijqjrycp5dkiyxma725sm
          CLOUDFLARE_PREVIEW_ACCOUNT_ID: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/jcpasxrfy5xau45vzcbe4toggu
          DISCORD_PREVIEW_BOT_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/bvjmz2zqmz5kciw5a6vcovqjgu
          DISCORD_GUILD_ID: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/ksw5s6oa5cdjd2zgj4hv6pnzjq
          DISCORD_E2E_ANNOUNCEMENT_CHANNEL_ID: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/j7kkoyn3d4oth4yciqni7qyhui
          DISCORD_E2E_RECEIVER_CHANNEL_ID: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/5dfywo6mrp2mfags4dxmsj4ale
          EMAIL_TO: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/e2e_email_to
          RESEND_PREVIEW_API_KEY: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/2dz4hpmhrtykmb3yaawfh5gemu
          EMAIL_FROM_NAME: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/rlylwe6lukzgenapthsykqsr2a
          EMAIL_FROM_EMAIL: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/ov4be76yq67mlf4zrxnwabwiom
          ADMIN_PREVIEW_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/bbf3rr6cu7q6qr2re7pyfjxg6e
          CF_ACCESS_CLIENT_ID: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/sqy7q34j3e7p4iqbsg7xc7rocu
          CF_ACCESS_CLIENT_SECRET: op://i56qshgciuy4cdg4pjrilaeriy/huou7uzehzinkmpm3le3gfimme/x52u6d5gqivvdnrmofs6n5sybe

      - id: install
        run: bun install --frozen-lockfile

      - name: Deploy isolated E2E Worker
        id: deploy
        env:
          ALCHEMY_STAGE: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          STAGE: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          CLOUDFLARE_API_TOKEN: ${{ steps.op_e2e.outputs.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.op_e2e.outputs.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          DISCORD_BOT_TOKEN: ${{ steps.op_e2e.outputs.DISCORD_PREVIEW_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ steps.op_e2e.outputs.DISCORD_GUILD_ID }}
          DISCORD_TARGET_CHANNEL_ID: ${{ steps.op_e2e.outputs.DISCORD_E2E_RECEIVER_CHANNEL_ID }}
          SOURCE_GUILD_ID: ${{ steps.op_e2e.outputs.DISCORD_GUILD_ID }}
          SOURCE_CHANNEL_ID: ${{ steps.op_e2e.outputs.DISCORD_E2E_ANNOUNCEMENT_CHANNEL_ID }}
          EMAIL_TO: ${{ steps.op_e2e.outputs.EMAIL_TO }}
          RESEND_API_KEY: ${{ steps.op_e2e.outputs.RESEND_PREVIEW_API_KEY }}
          EMAIL_FROM_NAME: ${{ steps.op_e2e.outputs.EMAIL_FROM_NAME }}
          EMAIL_FROM_EMAIL: ${{ steps.op_e2e.outputs.EMAIL_FROM_EMAIL }}
          ADMIN_TOKEN: ${{ steps.op_e2e.outputs.ADMIN_PREVIEW_TOKEN }}
        run: bunx alchemy deploy --stage "$ALCHEMY_STAGE" --yes

      - name: Publish and verify test announcement
        id: e2e
        env:
          E2E_MODE: remote
          E2E_WORKER_URL: https://discord-announcement-email-bridge-e2e-${{ github.run_id }}-${{ github.run_attempt }}.mynameistito.workers.dev
          NO_COLOR: "1"
          DISCORD_PREVIEW_BOT_TOKEN: ${{ steps.op_e2e.outputs.DISCORD_PREVIEW_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ steps.op_e2e.outputs.DISCORD_GUILD_ID }}
          DISCORD_E2E_ANNOUNCEMENT_CHANNEL_ID: ${{ steps.op_e2e.outputs.DISCORD_E2E_ANNOUNCEMENT_CHANNEL_ID }}
          DISCORD_E2E_RECEIVER_CHANNEL_ID: ${{ steps.op_e2e.outputs.DISCORD_E2E_RECEIVER_CHANNEL_ID }}
          EMAIL_TO: ${{ steps.op_e2e.outputs.EMAIL_TO }}
          RESEND_PREVIEW_API_KEY: ${{ steps.op_e2e.outputs.RESEND_PREVIEW_API_KEY }}
          EMAIL_FROM_NAME: ${{ steps.op_e2e.outputs.EMAIL_FROM_NAME }}
          EMAIL_FROM_EMAIL: ${{ steps.op_e2e.outputs.EMAIL_FROM_EMAIL }}
          ADMIN_PREVIEW_TOKEN: ${{ steps.op_e2e.outputs.ADMIN_PREVIEW_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ steps.op_e2e.outputs.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ steps.op_e2e.outputs.CF_ACCESS_CLIENT_SECRET }}
        run: bun run e2e

      - name: Destroy isolated E2E Worker
        id: destroy
        if: ${{ always() && steps.op_e2e.outcome == 'success' }}
        env:
          ALCHEMY_STAGE: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          CLOUDFLARE_API_TOKEN: ${{ steps.op_e2e.outputs.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.op_e2e.outputs.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
        run: bunx alchemy destroy --stage "$ALCHEMY_STAGE" --yes

      - name: Publish E2E summary
        if: ${{ always() }}
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          OP_OUTCOME: ${{ steps.op_e2e.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          DESTROY_OUTCOME: ${{ steps.destroy.outcome }}
          ALCHEMY_STAGE: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_WORKER_URL: https://discord-announcement-email-bridge-e2e-${{ github.run_id }}-${{ github.run_attempt }}.mynameistito.workers.dev
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun scripts/e2e-summary.ts
