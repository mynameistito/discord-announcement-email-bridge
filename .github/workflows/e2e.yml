name: Discord E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        id: op_e2e
        with:
          version: 2.34.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_PREVIEW_API_TOKEN: op://github-actions/jzwlhhnq7fhnsoazz2esnl4xt4/add more/CLOUDFLARE_PREVIEW_API_TOKEN
          CLOUDFLARE_PREVIEW_ACCOUNT_ID: op://github-actions/jzwlhhnq7fhnsoazz2esnl4xt4/add more/CLOUDFLARE_PREVIEW_ACCOUNT_ID
          DISCORD_PREVIEW_BOT_TOKEN: op://github-actions/jzwlhhnq7fhnsoazz2esnl4xt4/add more/DISCORD_PREVIEW_BOT_TOKEN
          DISCORD_GUILD_ID: op://github-actions/jzwlhhnq7fhnsoazz2esnl4xt4/add more/DISCORD_GUILD_ID
          DISCORD_E2E_ANNOUNCEMENT_CHANNEL_ID: op://github-actions/jzwlhhnq7fhnsoazz2esnl4xt4/j7kkoyn3d4oth4yciqni7qyhui
          DISCORD_E2E_RECEIVER_CHANNEL_ID: op://github-actions/jzwlhhnq7fhnsoazz2esnl4xt4/5dfywo6mrp2mfags4dxmsj4ale
          EMAIL_TO: op://github-actions/jzwlhhnq7fhnsoazz2esnl4xt4/add more/EMAIL_TO
          RESEND_PREVIEW_API_KEY: op://github-actions/jzwlhhnq7fhnsoazz2esnl4xt4/2dz4hpmhrtykmb3yaawfh5gemu
          EMAIL_FROM_NAME: op://github-actions/jzwlhhnq7fhnsoazz2esnl4xt4/add more/EMAIL_FROM_NAME
          EMAIL_FROM_EMAIL: op://github-actions/jzwlhhnq7fhnsoazz2esnl4xt4/add more/EMAIL_FROM_EMAIL
          ADMIN_PREVIEW_TOKEN: op://github-actions/jzwlhhnq7fhnsoazz2esnl4xt4/add more/ADMIN_PREVIEW_TOKEN
          CF_ACCESS_CLIENT_ID: op://github-actions/jzwlhhnq7fhnsoazz2esnl4xt4/add more/CF_ACCESS_CLIENT_ID
          CF_ACCESS_CLIENT_SECRET: op://github-actions/jzwlhhnq7fhnsoazz2esnl4xt4/add more/CF_ACCESS_CLIENT_SECRET

      - id: install
        run: bun install --frozen-lockfile

      - name: Deploy isolated E2E Worker
        id: deploy
        env:
          ALCHEMY_STAGE: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          STAGE: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          CLOUDFLARE_API_TOKEN: ${{ steps.op_e2e.outputs.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.op_e2e.outputs.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          DISCORD_BOT_TOKEN: ${{ steps.op_e2e.outputs.DISCORD_PREVIEW_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ steps.op_e2e.outputs.DISCORD_GUILD_ID }}
          DISCORD_TARGET_CHANNEL_ID: ${{ steps.op_e2e.outputs.DISCORD_E2E_RECEIVER_CHANNEL_ID }}
          SOURCE_GUILD_ID: ${{ steps.op_e2e.outputs.DISCORD_GUILD_ID }}
          SOURCE_CHANNEL_ID: ${{ steps.op_e2e.outputs.DISCORD_E2E_ANNOUNCEMENT_CHANNEL_ID }}
          EMAIL_TO: ${{ steps.op_e2e.outputs.EMAIL_TO }}
          RESEND_API_KEY: ${{ steps.op_e2e.outputs.RESEND_PREVIEW_API_KEY }}
          EMAIL_FROM_NAME: ${{ steps.op_e2e.outputs.EMAIL_FROM_NAME }}
          EMAIL_FROM_EMAIL: ${{ steps.op_e2e.outputs.EMAIL_FROM_EMAIL }}
          ADMIN_TOKEN: ${{ steps.op_e2e.outputs.ADMIN_PREVIEW_TOKEN }}
        run: bunx alchemy deploy --stage "$ALCHEMY_STAGE" --yes

      - name: Publish and verify test announcement
        id: e2e
        env:
          E2E_MODE: remote
          E2E_WORKER_URL: https://discord-announcement-email-bridge-e2e-${{ github.run_id }}-${{ github.run_attempt }}.mynameistito.workers.dev
          NO_COLOR: "1"
          DISCORD_PREVIEW_BOT_TOKEN: ${{ steps.op_e2e.outputs.DISCORD_PREVIEW_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ steps.op_e2e.outputs.DISCORD_GUILD_ID }}
          DISCORD_E2E_ANNOUNCEMENT_CHANNEL_ID: ${{ steps.op_e2e.outputs.DISCORD_E2E_ANNOUNCEMENT_CHANNEL_ID }}
          DISCORD_E2E_RECEIVER_CHANNEL_ID: ${{ steps.op_e2e.outputs.DISCORD_E2E_RECEIVER_CHANNEL_ID }}
          EMAIL_TO: ${{ steps.op_e2e.outputs.EMAIL_TO }}
          RESEND_PREVIEW_API_KEY: ${{ steps.op_e2e.outputs.RESEND_PREVIEW_API_KEY }}
          EMAIL_FROM_NAME: ${{ steps.op_e2e.outputs.EMAIL_FROM_NAME }}
          EMAIL_FROM_EMAIL: ${{ steps.op_e2e.outputs.EMAIL_FROM_EMAIL }}
          ADMIN_PREVIEW_TOKEN: ${{ steps.op_e2e.outputs.ADMIN_PREVIEW_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ steps.op_e2e.outputs.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ steps.op_e2e.outputs.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -o pipefail
          bun run e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Destroy isolated E2E Worker
        id: destroy
        if: ${{ always() && steps.op_e2e.outcome == 'success' }}
        env:
          ALCHEMY_STAGE: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          CLOUDFLARE_API_TOKEN: ${{ steps.op_e2e.outputs.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.op_e2e.outputs.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
        run: bunx alchemy destroy --stage "$ALCHEMY_STAGE" --yes

      - name: Publish E2E summary
        if: ${{ always() }}
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          OP_OUTCOME: ${{ steps.op_e2e.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          DESTROY_OUTCOME: ${{ steps.destroy.outcome }}
          ALCHEMY_STAGE: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_WORKER_URL: https://discord-announcement-email-bridge-e2e-${{ github.run_id }}-${{ github.run_attempt }}.mynameistito.workers.dev
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          status_mark() {
            case "$1" in
              success) printf '✅' ;;
              skipped) printf '⏭️' ;;
              cancelled) printf '⏹️' ;;
              *) printf '❌' ;;
            esac
          }

          if [ "$JOB_STATUS" = "success" ] && [ "$E2E_OUTCOME" = "success" ]; then
            echo "## ✅ Discord E2E passed" >> "$GITHUB_STEP_SUMMARY"
            echo "The complete Discord → Worker → Resend flow completed successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Discord E2E failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Review the failed lifecycle step and its detailed log output." >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo
            echo "| Lifecycle stage | Result |"
            echo "| --- | --- |"
            printf '| 1Password secret loading | %s `%s` |\n' "$(status_mark "$OP_OUTCOME")" "$OP_OUTCOME"
            printf '| Dependency installation | %s `%s` |\n' "$(status_mark "$INSTALL_OUTCOME")" "$INSTALL_OUTCOME"
            printf '| Isolated Worker deployment | %s `%s` |\n' "$(status_mark "$DEPLOY_OUTCOME")" "$DEPLOY_OUTCOME"
            printf '| Discord and Resend E2E test | %s `%s` |\n' "$(status_mark "$E2E_OUTCOME")" "$E2E_OUTCOME"
            printf '| Isolated Worker cleanup | %s `%s` |\n' "$(status_mark "$DESTROY_OUTCOME")" "$DESTROY_OUTCOME"
            echo
            echo "### Deployment details"
            echo
            printf -- '- **Stage:** `%s`\n' "$ALCHEMY_STAGE"
            echo "- **Worker:** [$E2E_WORKER_URL]($E2E_WORKER_URL)"
            echo "- **Run:** [$RUN_URL]($RUN_URL)"
            echo
            echo "### E2E checkpoints"
            echo
            echo '```text'
            if [ -s "$RUNNER_TEMP/e2e.log" ]; then
              grep -E '^(Checking Discord|Authenticated|Receiver channel|Seeding|Created test|Crossposted|Follower copy|Polling|Poll accepted|E2E passed|E2E failed|E2E script)' "$RUNNER_TEMP/e2e.log" || true
            else
              echo "No E2E runner log was produced."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
